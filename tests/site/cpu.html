<!doctype html>
<html><head><meta charset="utf-8"><title>Busy computer</title></head>
<body><h1>Quote</h1><span id="result"></span>
<script>
// An overloaded computer: the page's script runs in long stretches (the tab hardly answers) for ?ms=, then shows the plan.
const until = Date.now() + Number(new URLSearchParams(location.search).get('ms') || 3000);
function chunk() {
  const stop = Date.now() + 1500;
  while (Date.now() < stop) { /* busy */ }
  if (Date.now() < until) { setTimeout(chunk, 5); return; }
  const p = document.createElement('p'); p.id = 'plan'; p.textContent = 'Plan ready'; document.body.appendChild(p);
}
setTimeout(chunk, 50);
</script></body></html>
