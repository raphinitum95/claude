<!doctype html>
<html><head><meta charset="utf-8"><title>Sign in - verify</title></head>
<body><h1>Google Authenticator - Enter Code</h1>
<input id="code" name="code" autocomplete="off">
<button id="verify" type="button" onclick="verify()">Verify</button>
<p id="msg"></p>
<script>
// Like Okta: the code is checked when Verify is clicked, and each code is accepted once.
async function verify() {
  const r = await fetch('/okta/verify?code=' + encodeURIComponent(document.getElementById('code').value));
  const j = await r.json();
  document.getElementById('msg').textContent = r.ok ? 'Welcome' : j.errorSummary;
}
</script></body></html>
