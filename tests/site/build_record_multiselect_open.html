<!doctype html>
<html><head><meta charset="utf-8"><title>Custom multi-select that opens when its field is clicked</title></head>
<body>
<!-- like the Qantas quote page: clicking into the field shows the whole list at once, nothing is typed -->
<div class="multiSelectDropdown"><div class="multiSelect"><div class="drop">
  <div class="drop-display"><input type="text" id="cmp-Input" class="inputField" placeholder="Enter destinations"></div>
  <div class="drop-options" id="valueList" style="display:none"><div><a href="#" tabindex="-1">AUSTRALIA</a><a href="#" tabindex="-1">ALBANIA</a></div></div>
  <select id="myMulti" multiple style="display:none"><option>AUSTRALIA</option><option>ALBANIA</option></select>
</div></div></div>
<p id="chosen"></p><button id="elsewhere">Elsewhere</button>
<script>
  const list = document.getElementById('valueList');
  document.getElementById('cmp-Input').addEventListener('click', () => { list.style.display = 'block'; });
  list.addEventListener('click', (e) => {
    e.preventDefault();
    if (e.target.tagName === 'A') { document.getElementById('chosen').textContent += e.target.textContent + ';'; list.style.display = 'none'; }
  });
</script></body></html>
