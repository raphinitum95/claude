<!doctype html>
<html><head><meta charset="utf-8"><title>Hydrating</title></head>
<body>
<label id="l"><input type="radio" name="t"> Comprehensive Coverage</label>
<div id="app"></div>
<script>
// Renders for ~0.8 s after "load", and only attaches its real behaviour at 0.9 s: an earlier click is ignored.
let n = 0;
const t = setInterval(() => { app.appendChild(document.createElement('i')); if (++n >= 8) clearInterval(t); }, 100);
const swallow = (e) => e.preventDefault();
l.addEventListener('click', swallow);
setTimeout(() => l.removeEventListener('click', swallow), 900);
</script>
</body></html>
