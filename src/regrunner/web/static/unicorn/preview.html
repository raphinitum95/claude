  <style>
    /* ---- rig state: set data-eyes / data-brows / data-mouth / data-ears / data-fx on #unicorn (see docs/rig-spec.md) ---- */
    #unicorn .eye-closed, #unicorn .eye-wide-extra, #unicorn .fx, #unicorn #pivots,
    #unicorn #mouth-smile, #unicorn #mouth-frown, #unicorn #mouth-open { display: none; }
    #unicorn.show-pivots #pivots { display: inline; }

    /* eyes: open (default) | closed | wide | sad | scared | angry */
    #unicorn[data-eyes="closed"] .eye-open { display: none; }
    #unicorn[data-eyes="closed"] .eye-closed { display: inline; }
    #unicorn[data-eyes="wide"] .eye-wide-extra { display: inline; }
    #unicorn[data-eyes="sad"] .flicks { display: none; } /* the drooping lid would leave the tips floating */
    #unicorn[data-eyes="scared"] .iris { transform: scale(.78); }
    #unicorn[data-eyes="scared"] #eye-left .iris { transform-origin: 211px 264px; }
    #unicorn[data-eyes="scared"] #eye-right .iris { transform-origin: 329px 264px; }
    #unicorn[data-eyes="wide"] #eye-left .eye-open, #unicorn[data-eyes="scared"] #eye-left .eye-open { transform-origin: 206px 262px; transform: scale(1.1); }
    #unicorn[data-eyes="wide"] #eye-right .eye-open, #unicorn[data-eyes="scared"] #eye-right .eye-open { transform-origin: 334px 262px; transform: scale(1.1); }

    /* eyelids: scaleY(0) = open. A blink animates to scaleY(1) and back. Sad / angry park the lid part-way, slanted. */
    #eyelid-left, #eyelid-right { transform: scaleY(0); }
    #eyelid-left { transform-origin: 206px 226px; }
    #eyelid-right { transform-origin: 334px 226px; }
    #unicorn[data-eyes="sad"] #eyelid-left { transform: rotate(-16deg) scaleY(.34); }
    #unicorn[data-eyes="sad"] #eyelid-right { transform: rotate(16deg) scaleY(.34); }
    #unicorn[data-eyes="angry"] #eyelid-left { transform: rotate(20deg) scaleY(.4); }
    #unicorn[data-eyes="angry"] #eyelid-right { transform: rotate(-20deg) scaleY(.4); }

    /* brows: neutral (default) | up | sad | angry | scared */
    #brow-left { transform-origin: 205px 198px; }
    #brow-right { transform-origin: 335px 198px; }
    #unicorn[data-brows="up"] #brow-left, #unicorn[data-brows="up"] #brow-right { transform: translateY(-6px); }
    #unicorn[data-brows="sad"] #brow-left { transform: translateY(-2px) rotate(-20deg); }
    #unicorn[data-brows="sad"] #brow-right { transform: translateY(-2px) rotate(20deg); }
    #unicorn[data-brows="angry"] #brow-left { transform: translateY(9px) rotate(22deg) scale(1.1); }
    #unicorn[data-brows="angry"] #brow-right { transform: translateY(9px) rotate(-22deg) scale(1.1); }
    #unicorn[data-brows="scared"] #brow-left { transform: translateY(-9px) rotate(-12deg); }
    #unicorn[data-brows="scared"] #brow-right { transform: translateY(-9px) rotate(12deg); }

    /* mouths: neutral (default) | smile | frown | open */
    #unicorn[data-mouth="smile"] #mouth-neutral, #unicorn[data-mouth="frown"] #mouth-neutral, #unicorn[data-mouth="open"] #mouth-neutral { display: none; }
    #unicorn[data-mouth="smile"] #mouth-smile, #unicorn[data-mouth="frown"] #mouth-frown, #unicorn[data-mouth="open"] #mouth-open { display: inline; }
    #mouth-open { transform-origin: 270px 316px; }
    #unicorn[data-eyes="scared"][data-mouth="open"] #mouth-open { transform: scale(.62, 1.05); }

    /* ears: neutral (default) | perk | droop | back | flat */
    #ear-left { transform-origin: 172px 176px; }
    #ear-right { transform-origin: 368px 176px; }
    #unicorn[data-ears="perk"] #ear-left, #unicorn[data-ears="perk"] #ear-right { transform: translateY(-4px) scale(1.05); }
    #unicorn[data-ears="droop"] #ear-left { transform: rotate(-30deg); }
    #unicorn[data-ears="droop"] #ear-right { transform: rotate(30deg); }
    #unicorn[data-ears="back"] #ear-left { transform: rotate(-40deg) scaleY(.92); }
    #unicorn[data-ears="back"] #ear-right { transform: rotate(40deg) scaleY(.92); }
    #unicorn[data-ears="flat"] #ear-left { transform: rotate(-58deg) scaleY(.88); }
    #unicorn[data-ears="flat"] #ear-right { transform: rotate(58deg) scaleY(.88); }

    /* effect hints: sparkle | sweat | steam (rain cloud is Phase 2 art) */
    #unicorn[data-fx="sparkle"] #fx-sparkle, #unicorn[data-fx="sweat"] #fx-sweat, #unicorn[data-fx="steam"] #fx-steam { display: inline; }

    /* ---- shading: every overlay / cast shadow has class "shade". One knob: --shade-strength (1 = as drawn, 0 = none, 1.5 = stronger) ---- */
    #unicorn { --shade-strength: 1; }
    #unicorn .shade { opacity: var(--shade-strength); }

    /* ---- pivots (user units of the 600 x 600 viewBox) ---- */
    #head-rig, #head { transform-origin: 270px 330px; }
    #neck { transform-origin: 270px 340px; }
    #horn { transform-origin: 270px 150px; }
    #tail { transform-origin: 378px 470px; }
    #body { transform-origin: 270px 470px; }
    #chest-heart { transform-origin: 270px 400px; }
    #mane-front { transform-origin: 262px 120px; }
    #mane-back { transform-origin: 270px 300px; }
    #mane-lock-1 { transform-origin: 186px 226px; }
    #mane-lock-2 { transform-origin: 214px 262px; }
    #mane-lock-3 { transform-origin: 180px 190px; }
    #mane-lock-4 { transform-origin: 360px 190px; }
    #mane-lock-5 { transform-origin: 326px 262px; }
    #mane-lock-6 { transform-origin: 354px 226px; }
    #front-leg-left { transform-origin: 240px 400px; }
    #front-leg-right { transform-origin: 300px 400px; }
    #hoof-left { transform-origin: 237px 532px; }
    #hoof-right { transform-origin: 303px 532px; }
    #eye-left { transform-origin: 206px 262px; }
    #eye-right { transform-origin: 334px 262px; }
    #cheek-left { transform-origin: 188px 306px; }
    #cheek-right { transform-origin: 352px 306px; }
    #shadow { transform-origin: 270px 570px; }
  </style>

  <div class="bar" id="moods" role="group" aria-label="Mood"></div>

    <label><input type="checkbox" id="pivots-toggle"> show pivots</label>
    <span>state: <code id="state"></code></span>

</main>
<script>
const MOODS = {"neutral": {"eyes": "open", "brows": "neutral", "mouth": "neutral", "ears": "neutral", "fx": "none"}, "happy": {"eyes": "open", "brows": "up", "mouth": "smile", "ears": "neutral", "fx": "none"}, "excited": {"eyes": "wide", "brows": "up", "mouth": "open", "ears": "perk", "fx": "sparkle"}, "joyful": {"eyes": "closed", "brows": "up", "mouth": "open", "ears": "perk", "fx": "sparkle"}, "sad": {"eyes": "sad", "brows": "sad", "mouth": "frown", "ears": "droop", "fx": "none"}, "scared": {"eyes": "scared", "brows": "scared", "mouth": "open", "ears": "flat", "fx": "sweat"}, "angry": {"eyes": "angry", "brows": "angry", "mouth": "frown", "ears": "back", "fx": "steam"}};
const root = document.getElementById("unicorn");
const bar = document.getElementById("moods");
function setMood(name) {
  const m = MOODS[name];
  for (const k of Object.keys(m)) root.setAttribute("data-" + k, m[k]);
  for (const b of bar.children) b.setAttribute("aria-pressed", String(b.dataset.mood === name));
  document.getElementById("state").textContent = JSON.stringify(m);
}
for (const name of Object.keys(MOODS)) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = name; b.dataset.mood = name;
  b.addEventListener("click", () => setMood(name));
  bar.appendChild(b);
}
document.getElementById("pivots-toggle").addEventListener("change", e => root.classList.toggle("show-pivots", e.target.checked));
// Blink = scale the two eyelids shut and back (what Phase 2's idle blink will animate).
document.getElementById("blink").addEventListener("click", () => {
  const lids = [document.getElementById("eyelid-left"), document.getElementById("eyelid-right")];
  for (const l of lids) { l.style.transition = "transform 90ms"; l.style.transform = "scaleY(1)"; }
  setTimeout(() => { for (const l of lids) l.style.transform = ""; }, 140);
});
setMood("neutral");
</script>
